# Checkov configuration -- run with `make security` (or `checkov --config-file .checkov.yaml`).
#
# Every suppression below is a deliberate, documented decision for a *learning*
# repository. Read the reason before copying any of this into production code.

directory:
  - .

framework:
  - terraform

quiet: true
compact: true

# Fail the build on any finding that is not explicitly skipped below.
soft-fail: false

download-external-modules: false
evaluate-variables: true

skip-path:
  - .git
  - .terraform
  - docs/superpowers

skip-check:
  # --- Cost-driven suppressions -------------------------------------------
  # CKV_AWS_144: S3 cross-region replication. Replicating lab state to a second
  #   region doubles storage cost and teaches nothing about networking.
  - CKV_AWS_144
  # CKV2_AWS_62: S3 event notifications on the state bucket. Not useful here.
  - CKV2_AWS_62
  # CKV_AWS_18 / CKV2_AWS_61: S3 access logging + lifecycle on the state bucket.
  #   Access logging needs a second bucket, and expiring state object versions
  #   can destroy your only recovery path. Both are wrong for a state bucket.
  - CKV_AWS_18
  - CKV2_AWS_61
  # CKV_AWS_338: 1-year CloudWatch log retention. These labs deliberately use
  #   1-day retention so learners are not billed for logs they forget about.
  - CKV_AWS_338
  # CKV_AWS_158: KMS encryption for CloudWatch log groups. A customer-managed
  #   key costs $1/month per key; log groups are encrypted with an AWS-owned key
  #   by default. `modules/flow-logs` exposes `kms_key_id` for those who want it.
  - CKV_AWS_158
  # CKV_AWS_66: CloudWatch log group KMS -- same reasoning as CKV_AWS_158.
  - CKV_AWS_66

  # --- Teaching-driven suppressions ---------------------------------------
  # CKV_AWS_130: "subnet should not auto-assign public IPs". Lab 02 exists
  #   specifically to teach what auto-assign does. It is opt-in per subnet and
  #   defaults to false in `modules/vpc`.
  - CKV_AWS_130
  # CKV2_AWS_11 / CKV2_AWS_12: flow logs and default-SG restriction on every VPC.
  #   Lab 08 teaches flow logs; enabling them everywhere would bill every lab.
  #   `modules/vpc` DOES lock the default security group down to zero rules.
  - CKV2_AWS_11
  # CKV_AWS_126: detailed EC2 monitoring. Costs extra per instance; the
  #   `test-instance` module exposes `enable_detailed_monitoring` for opt-in.
  - CKV_AWS_126
  # CKV_AWS_79: IMDSv1. Every instance in this repo sets http_tokens=required.
  #   Kept in the list only because Checkov flags launch templates it cannot
  #   evaluate; see modules/test-instance/main.tf for the actual setting.
  # (intentionally NOT skipped -- we want this to stay enforced)
